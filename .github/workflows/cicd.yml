name: CI/CD

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**
      - docs/**
      - refactor/**
      - test/**
      - ci/**
      - perf/**
      - style/**
      - build/**
      - copilot/**
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Install Playwright browser
        run: uv run python -m playwright install chromium

      - name: Ruff lint (all rules)
        run: uv run ruff check --output-format=github

      - name: Type check (ty)
        run: uv run ty check --error-on-warning

      - name: Run pre-commit hooks via uvx
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Install mcp-publisher
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

  rrt-checks:
    name: repo-release-tools policy checks
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run rrt policy checks
        uses: Anselmoo/repo-release-tools@v1.17.1
        with:
          check-branch-name: ${{ !startsWith(github.ref, 'refs/tags/') }}
          check-commit-subject: "true"
          check-changelog: ${{ !startsWith(github.ref, 'refs/tags/') }}
          changelog-strategy: auto
          check-doctor: "true"
          check-release-health: ${{ startsWith(github.ref, 'refs/tags/') }}
          verbose: "1"

  test:
    name: Tests (${{ matrix.python-version }})
    needs: [lint, rrt-checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Run tests
        run: uv run pytest -xvs
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}
          slug: Anselmoo/mcp-zen-of-languages
          fail_ci_if_error: false

  language-tests:
    name: Language tests (${{ matrix.language }})
    needs: [lint, rrt-checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            pytest_target: tests/analyzers/test_rust_analyzer.py tests/detectors/test_rust_detectors.py tests/analyzers/test_dependency_analysis.py -k rust
            install_cmd: ""
          - language: ruby
            pytest_target: tests/analyzers/test_language_analyzers.py tests/analyzers/test_dependency_analysis.py tests/coverage/test_coverage_boost.py -k ruby
            install_cmd: gem install --no-document rubocop
          - language: go
            pytest_target: tests/analyzers/test_go_analyzer.py tests/detectors/test_go_detectors.py tests/analyzers/test_dependency_analysis.py -k go
            install_cmd: ""
          - language: javascript
            pytest_target: tests/analyzers/test_language_analyzers.py tests/analyzers/test_dependency_analysis.py -k javascript
            install_cmd: npm install -g eslint
          - language: typescript
            pytest_target: tests/detectors/test_typescript_detectors.py tests/analyzers/test_dependency_analysis.py -k typescript
            install_cmd: npm install -g eslint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Set up Node.js
        if: ${{ matrix.language == 'javascript' || matrix.language == 'typescript' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up Rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install language linter/runtime prerequisites
        if: ${{ matrix.install_cmd != '' }}
        run: ${{ matrix.install_cmd }}

      - name: Run language-focused tests
        run: uv run pytest -x -q --no-cov ${{ matrix.pytest_target }}

      - name: Subrun smoke check
        env:
          SMOKE_LANGUAGE: ${{ matrix.language }}
        run: |
          uv run python - <<'PY'
          import os

          from mcp_zen_of_languages.utils.subprocess_runner import SubprocessToolRunner

          samples = {
              "rust": "fn main() {}",
              "ruby": "puts 'hello'",
              "go": "package main\nfunc main() {}",
              "javascript": "function demo(){return 1}",
              "typescript": "const demo: number = 1;",
          }

          language = os.environ["SMOKE_LANGUAGE"]
          code = samples.get(language, "")
          runner = SubprocessToolRunner()
          results = runner.run_for_language(language, code)
          if not results:
              raise SystemExit(
                  f"No external tool executed for {language}; verify linter/runtime setup."
              )
          print(f"Subrun smoke passed for {language}: {', '.join(sorted(results))}")
          PY

  visual-regression:
    name: Visual regression
    needs: [lint, rrt-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Run visual regression tests
        run: uv run pytest tests/e2e/test_visual_regression.py -q --no-cov

  docker-image-check:
    name: Docker image smoke check
    needs: [test, language-tests, visual-regression]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: mcp-zen-of-languages:ci

      - name: Smoke test CLI command
        run: docker run --rm mcp-zen-of-languages:ci zen --help

      - name: Smoke test MCP server startup
        run: |
          docker run --rm mcp-zen-of-languages:ci sh -lc '
            set +e
            timeout 5 zen-mcp-server >/tmp/server.log 2>&1
            code=$?
            if [ "$code" -eq 124 ]; then
              exit 0
            fi
            if [ "$code" -eq 0 ] && grep -q "Starting MCP server" /tmp/server.log; then
              exit 0
            fi
            cat /tmp/server.log
            exit 1
          '

  docker-publish:
    name: Publish Docker image
    needs: docker-image-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # {{version}} is load-bearing, not redundant with {{major}}.{{minor}}:
            # server.json pins the OCI package to the FULL version
            # (ghcr.io/anselmoo/mcp-zen-of-languages:0.9.1), and the MCP registry
            # validates that exact reference exists before it will publish.
            #
            # MEASURED 2026-09-03 on tag v0.9.1 (Actions run 33720718151): only
            # {{major}}.{{minor}} was configured, so the push produced :0.9 and
            # :latest and never :0.9.1. "Publish Docker image" reported SUCCESS,
            # and the next job failed with
            #   400 "OCI image 'ghcr.io/anselmoo/mcp-zen-of-languages:0.9.1'
            #        does not exist in the registry"
            # -- after PyPI had already published irreversibly.
            #
            # This was latent in every prior release: ghcr holds 0.1 .. 0.9 and no
            # patch-level tag at all. It only surfaced on the first release where
            # {{major}}.{{minor}} diverges from the real version.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build:
    name: Build package
    needs: [test, language-tests, visual-regression]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  build-mcpb:
    name: Build .mcpb package
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Build .mcpb bundle
        uses: Anselmoo/mcp2mcpb@162b8c56d000073f7765381f6259d57fd3cfbc28
        with:
          package: mcp-zen-of-languages
          registry: pypi
          mode: reference
          from-dist: dist/
          attach-to-release: 'false'
      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-package
          path: dist/*.mcpb

  sbom:
    name: Generate SBOM
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  attest:
    name: Attest build provenance
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  docs-build:
    name: Build documentation
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install docs native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libcairo2-dev pkg-config libffi-dev

      - name: Sync docs dependencies
        run: uv sync --group docs

      - name: Build docs
        env:
          MKDOCS_SOCIAL_ENABLED: "true"
          MKDOCS_GIT_REVISION_ENABLED: "true"
        run: uv run zensical build -f mkdocs.yml

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  docs-deploy:
    name: Deploy docs to GitHub Pages
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, sbom, attest]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-zen-of-languages
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI package
    needs: publish-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package from TestPyPI (retry)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..8}; do
            if python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "mcp-zen-of-languages==${VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Package was not installable from TestPyPI after retries."
              exit 1
            fi
            echo "Retrying TestPyPI install in 20s (attempt ${attempt}/8)..."
            sleep 20
          done

      - name: Smoke test installed CLI
        run: zen --help

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sbom, attest, publish-testpypi, verify-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-zen-of-languages
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [publish-pypi, docker-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Sync server.json version with release tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(
                if .registryType == "pypi" then .version = $v
                elif .registryType == "oci" then .identifier |= sub(":[^:]+$"; ":" + $v)
                else . end)
          ' server.json > server.tmp.json && mv server.tmp.json server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  github-release:
    name: Create GitHub release
    needs: [publish-pypi, sbom, docker-publish, build-mcpb]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: .

      - name: Download .mcpb artifact
        uses: actions/download-artifact@v8
        with:
          name: mcpb-package
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.spdx.json
